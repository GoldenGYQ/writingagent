name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_installer.ps1

      - name: Smoke-test installed application
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/smoke_test_windows_installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JLU-Writing-Agent-Windows-${{ github.ref_name }}
          path: dist/installer/JLU-Writing-Agent-Setup-*.exe
          if-no-files-found: error

      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/installer/JLU-Writing-Agent-Setup-*.exe
          --generate-notes
          --title "JLU Writing Agent ${{ github.ref_name }}"
